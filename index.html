<!DOCTYPE html>
<html lang="tr">
<head>
 
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P55R71D5FM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config','G-P55R71D5FM');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not Sayfası</title>

  <style>
    :root{
      --bg:#000;
      --white:#fff;
      --stem:#22c55e;      
      --stemGlow: rgba(34,197,94,.45);
      --petalGlow: rgba(255,255,255,.85);
      --petalGlow2: rgba(255,255,255,.35);
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .dot {
      position: relative;
      font-size: 52px;
      color: var(--white);
      user-select: none;
      cursor: pointer;
      line-height: 1;
      filter: drop-shadow(0 0 10px rgba(255,255,255,.25));
    }

    .scene{
      position: absolute;
      left: 50%;
      bottom: 120%;
      transform: translateX(-50%);
      width: 220px;
      height: 260px;
      pointer-events: none;
    }

    .plant{
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      width: 220px;
      height: 240px;
      opacity: 1;
      transform-origin: 50% 100%;
      animation: plantWilt 1.8s ease-in forwards;
      animation-delay: 6.2s; 
    }

    .stem{
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 6px;
      height: 0px;
      border-radius: 999px;
      background: linear-gradient(#1faa54, var(--stem));
      box-shadow: 0 0 18px var(--stemGlow);
      animation: stemGrow 2.2s cubic-bezier(.2,.9,.2,1) forwards;
    }

    .leaf{
      position: absolute;
      bottom: 88px;
      width: 44px;
      height: 22px;
      opacity: 0;
      background: radial-gradient(circle at 30% 40%, #38d97a, #1faa54);
      box-shadow: 0 0 14px rgba(34,197,94,.25);
      border-radius: 999px 999px 999px 0;
      animation: leafIn .9s ease-out forwards;
      animation-delay: 1.4s;
    }
    .leaf.left{
      left: calc(50% - 10px);
      transform: rotate(-28deg) scale(.4);
      transform-origin: 100% 50%;
    }
    .leaf.right{
      left: calc(50% - 34px);
      transform: rotate(208deg) scale(.4);
      transform-origin: 100% 50%;
      border-radius: 999px 999px 0 999px;
    }

    .bud{
      position: absolute;
      left: 50%;
      bottom: 170px;
      width: 10px;
      height: 10px;
      transform: translateX(-50%) scale(0);
      border-radius: 999px;
      background: var(--white);
      box-shadow: 0 0 18px rgba(255,255,255,.55);
      opacity: 0;
      animation: budIn .8s ease-out forwards;
      animation-delay: 2.3s;
    }

    .flower{
      position: absolute;
      left: 50%;
      bottom: 152px;
      width: 120px;
      height: 120px;
      transform: translateX(-50%) scale(.15);
      opacity: 0;
      filter: drop-shadow(0 0 18px var(--petalGlow));
      animation: bloom 1.2s cubic-bezier(.2,.9,.2,1) forwards;
      animation-delay: 3.0s;
    }

    .petal{
      position: absolute;
      left: 50%;
      top: 50%;
      width: 70px;
      height: 28px;
      transform-origin: 0% 50%;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 40%, #ffffff, #f3f3f3);
      box-shadow:
        0 0 18px var(--petalGlow),
        0 0 40px var(--petalGlow2);
      opacity: .95;
    }

    /* 8 petal */
    .p1{ transform: translate(-8%, -50%) rotate(0deg); }
    .p2{ transform: translate(-8%, -50%) rotate(45deg); }
    .p3{ transform: translate(-8%, -50%) rotate(90deg); }
    .p4{ transform: translate(-8%, -50%) rotate(135deg); }
    .p5{ transform: translate(-8%, -50%) rotate(180deg); }
    .p6{ transform: translate(-8%, -50%) rotate(225deg); }
    .p7{ transform: translate(-8%, -50%) rotate(270deg); }
    .p8{ transform: translate(-8%, -50%) rotate(315deg); }

    .center{
      position: absolute;
      left: 50%;
      top: 50%;
      width: 16px;
      height: 16px;
      transform: translate(-50%, -50%);
      border-radius: 999px;
      background: #ffffff;
      box-shadow:
        0 0 14px rgba(255,255,255,.8),
        0 0 34px rgba(255,255,255,.35);
    }

    /* Parıldama efekti */
    .sparkle{
      position: absolute;
      inset: 0;
      opacity: 0;
      animation: sparkle 2.2s ease-in-out infinite;
      animation-delay: 3.2s;
    }
    .sparkle::before,
    .sparkle::after{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      width: 140px;
      height: 140px;
      transform: translate(-50%,-50%) rotate(20deg);
      border-radius: 999px;
      background: radial-gradient(circle, rgba(255,255,255,.35), rgba(255,255,255,0) 60%);
      filter: blur(1px);
    }
    .sparkle::after{
      transform: translate(-50%,-50%) rotate(-20deg);
      opacity: .75;
    }

    /* Mutlu yıllar yazısı: sahnenin üstünde, tam ortada */
    .message{
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) translateY(10px);
      color: #fff;
      font-weight: 700;
      letter-spacing: .8px;
      font-size: clamp(28px, 5vw, 56px);
      opacity: 0;
      text-align: center;
      text-shadow:
        0 0 16px rgba(255,255,255,.35),
        0 0 42px rgba(255,255,255,.20);
      animation: messageIn 1.2s ease-out forwards;
      animation-delay: 7.8s; 
      pointer-events: none;
      white-space: nowrap;
    }

    .hint{
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      color: rgba(255,255,255,.55);
      font-size: 13px;
      letter-spacing: .3px;
      user-select: none;
    }

    /* Animasyonlar */
    @keyframes stemGrow{
      0%{ height: 0px; }
      100%{ height: 190px; }
    }

    @keyframes leafIn{
      0%{ opacity: 0; }
      100%{ opacity: .95; transform: rotate(var(--rot)) scale(1); }
    }
    .leaf.left{ --rot: -28deg; }
    .leaf.right{ --rot: 208deg; }

    @keyframes budIn{
      0%{ opacity: 0; transform: translateX(-50%) scale(0); }
      100%{ opacity: 1; transform: translateX(-50%) scale(1); }
    }

    @keyframes bloom{
      0%{ opacity: 0; transform: translateX(-50%) scale(.15); }
      100%{ opacity: 1; transform: translateX(-50%) scale(1); }
    }

    @keyframes sparkle{
      0%,100%{ opacity: .25; transform: scale(1); }
      50%{ opacity: .65; transform: scale(1.06); }
    }

    @keyframes plantWilt{
      0%{
        opacity: 1;
        filter: none;
        transform: translateX(-50%) rotate(0deg) scale(1);
      }
      100%{
        opacity: .18;
        filter: grayscale(1);
        transform: translateX(-50%) rotate(-10deg) scale(.92);
      }
    }

    @keyframes messageIn{
      0%{ opacity: 0; transform: translate(-50%, -50%) translateY(10px); }
      100%{ opacity: 1; transform: translate(-50%, -50%) translateY(0); }
    }

    .scene:not(.play) .stem,
    .scene:not(.play) .leaf,
    .scene:not(.play) .bud,
    .scene:not(.play) .flower,
    .scene:not(.play) .sparkle,
    .scene:not(.play) .plant,
    .message:not(.play){
      animation: none !important;
      opacity: 0;
    }
    .scene:not(.play) .stem{ opacity: 1; height: 0; }
  </style>
</head>

<body>
  <div class="dot" id="dot" aria-label="Animasyonu başlat">
    .
    <div class="scene" id="scene">
      <div class="plant">
        <div class="stem"></div>
        <div class="leaf left"></div>
        <div class="leaf right"></div>
        <div class="bud"></div>

        <div class="flower">
          <div class="petal p1"></div>
          <div class="petal p2"></div>
          <div class="petal p3"></div>
          <div class="petal p4"></div>
          <div class="petal p5"></div>
          <div class="petal p6"></div>
          <div class="petal p7"></div>
          <div class="petal p8"></div>
          <div class="center"></div>
          <div class="sparkle"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="message" id="message">Mutlu Yıllar</div>
  <div class="hint">Noktaya tıkla</div>

  <script>
    const dot = document.getElementById('dot');
    const scene = document.getElementById('scene');
    const message = document.getElementById('message');

    function restart(){
      scene.classList.remove('play');
      message.classList.remove('play');

     
      void scene.offsetWidth;

      scene.classList.add('play');
      message.classList.add('play');
    }

    
    restart();

    
    dot.addEventListener('click', restart);
  </script>
</body>
</html>
