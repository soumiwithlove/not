    <meta charset="UTF-8">
    <title>
        Merhaba buraya baktığına göre belki de beni merak etmişsindir şimdi yazacaklarımı sana söylemek istedim ama umrunda olmayabilirdi,kavga çıkabilirdi bana 
        bahane falan diyebilirdin bende bunun olmasını istemedim artık kavga edicek halim yok haklı çıkmak gibi bi derdim de ama yine de hislerimi sana anlatmasam
        hiç rahat edemem ben bilirsin.
        Bana artık seni umursamadığımı,sana soğuk ve kötü davrandığımı hatta artık seni sevmediğimi söylesen de bunların hiçbiri doğru değil. Seni seviyorum muhtemelen
        sen bunu okurken de seni seviyorum. Eskisi gibi seviyorum seni ama sana eskisi gibi bakamıyorum istesem de yapamıyorum sana o değeri veremiyorum çünkü istesem de
        sana hiç güvenmiyorum. 
        Ben yavaş yavaş güvenimi topluyordum ama bi süre sonra aynı rüyayı gördüm tekrar bu periyotlar halinde yaşanıyordu ve ben bir yandan seni çok seviyordum ama 
        bir yandan gerçekten kendime olan biteni yediremiyordum. Hani bana demiştin ya bana kinlisin diye beni sevmiyorsun diye hatta takıntı falan demiştin. 
        İşte tam bu yüzden sana çok sinirlenmiştim çünkü keşke sana karşı bir kin duyabilseydim keşke senden soğuyabilseydim çünkü o zaman arkamı dönüp gitmek bu kadar
        zor olmazdı ama ben her seferinde kendimi ezip geçtiğimi hissettim. Sen bana olmadığım biri gibi davranıyorum mutsuzum dediğinde üzülmüştüm, seni anlıyordum ama
        her seferinde seni anlamadığımı söyledin oysa ki belki de şu dünyada seni en iyi anlayan bendim.
        Seni seviyodum seninleyken mutluydum bana iyi davrandığında bir şeyleri unutabileceğimi ve geride bırakabileceğimi düşündüm ta ki bana kötü davranıp ardından beni
        suçlayana kadar tabi ben de kabul ediyorum ki hatalarım oldu yanlışlar yaptım ama düzeltmeye çalışmadın diyemezsin. Oysa sen düzelttiklerini geri almak istiyordun
        öyle ki bi süre sonra artık sanki alelade bir şeymiş gibi konuşmaya affettiğim şeyin büyüklüğünü unutup sen ne yaptın ki, neye yaradın ki, faydan dokunmadı hep zararın
        dokundu demeye başladın bunları bir kere demedin buna benzer şeyleri artık her kavgamızda zehirli bir ok atıyormuşsun gibi söylemeye başladın işte tam buraya kadar,
        her şeyin düzeleceğine inanmıştım ama yavaş yavaş çok ama çok yavaş bir şekilde buna dair inancım kaybolmaya başladı. Sadece görmek istedim, biraz geri çekilsem ne olurdu
        senin davrandığın gibi davransam ne olurdu bu şekilde öğrendim ki bizim ilişkimizde hiçbir ilişkide olmayan bir çifte standart var.
        Senin davrandığın gibi davrandığımda bana seni siklemediğimi söyledin.
        Seni kaybetmek istemedim bunları açıldığım için yaptığımı söyleyince yanlış anlaşılmak da istemedim ve bir yandan kopamayız diye düşünüyodum. İçimde sadece küçük
        bir damla inanç kalmıştı ve onu da o gece seni çok özlediğimi ve seni sevdiğimi söylemeye harcadım bizi özlemiştim o gece. Vicdanın rahat olsun diye bana bahane diyeceğini
        açıldım diye senin tabirinler götümün kalktığını düşünebilirsin ama öyle olsaydı ne bunları yapar senle konuşmaya çalışırdım ne de bu mektuba vakit harcardım eğer 
        senin dediğin gibi olsaydım senin beni nasıl anladığın ve beni hakkımda ne düşündüğün gram umrumda olmazdı.
        Ama seni gerçekten kalpten bir şekilde sevdim, bana yardımcı olduğun içinde sana minnnettarım o gece beni sevmediğini artık kabul etmiştim ama artık buna üzülmüyorum
        seninde vicdanın rahat olsun ki geri dönme diye beni suçladığını biliyorum.
        Çünkü benim yerime açıldığı için ya da sana kin duyduğu için seni siklemeyen seni sevmeyen birini unutmak epey kolay olurdu.
        Keşke öyle olsaydı. Çünkü bu sevgiyi haketmediğini biliyorum.
        Yine de her şey için teşekkür ederim. Bunlar benim düşüncelerim ve hislerimdi katılabilirsin veya katılmayabilirsin.
        Düşman değiliz.
        İyi ki vardın.
    </title>
