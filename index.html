<!DOCTYPE html>
<html lang="tr">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P55R71D5FM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config','G-P55R71D5FM');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not Sayfası</title>

  <style>
    :root{
      --bg:#000;
      --stem:#22c55e;
      --stemGlow: rgba(34,197,94,.7);

      /* Zambak tonları (beyaz) */
      --petal1:#ffffff;
      --petal2:#f3f3f3;
      --petal3:#e8e8e8;

      /* Glow güçlendirildi */
      --glow1: rgba(255,255,255,.95);
      --glow2: rgba(255,255,255,.55);
      --glow3: rgba(255,255,255,.25);

      --text:#fff;
    }

    html, body{
      margin:0; padding:0;
      width:100%; height:100%;
      background: var(--bg);
      overflow:hidden;
      font-family: Arial, sans-serif;
    }

    /* Tüm ekran tıklanabilir (refresh yok, restart var) */
    .stage{
      position: fixed;
      inset: 0;
      cursor: pointer;
      user-select: none;
    }

    /* Mesaj üstte, solma bittikten sonra */
    .message{
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      color: var(--text);
      font-weight: 800;
      letter-spacing: .8px;
      font-size: clamp(26px, 4.5vw, 54px);
      opacity: 0;
      white-space: nowrap;
      text-shadow:
        0 0 18px rgba(255,255,255,.40),
        0 0 48px rgba(255,255,255,.22);
      pointer-events: none;
      animation: msgIn 1.1s ease-out forwards;
      animation-delay: 9.2s; /* solma + dökülme sonrası */
    }

    /* Sahne: zambaklar en alttan büyür */
    .scene{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 80vh;
      pointer-events: none;
    }

    /* Bitki kökü (çoklu saplar) */
    .plant{
      position:absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 420px;
      height: 80vh;
      transform-origin: 50% 100%;
      opacity: 1;
      animation: wilt 2.0s ease-in forwards;
      animation-delay: 7.0s;
    }

    /* Saplar (kısa başlar, orta boya gelir) */
    .stem{
      position:absolute;
      bottom: 0;
      width: 7px;
      height: 0px;
      border-radius: 999px;
      background: linear-gradient(#179a4b, var(--stem));
      box-shadow: 0 0 22px var(--stemGlow);
      animation: stemGrow 2.3s cubic-bezier(.2,.9,.2,1) forwards;
    }
    .s1{ left: 50%; animation-delay: .0s; }
    .s2{ left: 44%; animation-delay: .1s; }
    .s3{ left: 56%; animation-delay: .15s; }
    .s4{ left: 38%; animation-delay: .2s; }
    .s5{ left: 62%; animation-delay: .25s; }

    /* Yapraklar */
    .leaf{
      position:absolute;
      bottom: 28vh;
      width: 76px;
      height: 40px;
      opacity: 0;
      background: radial-gradient(circle at 30% 35%, #53e08c, #179a4b 70%);
      box-shadow: 0 0 18px rgba(34,197,94,.30);
      border-radius: 999px 999px 999px 0;
      transform-origin: 0% 50%;
      animation: leafIn .9s ease-out forwards;
      animation-delay: 1.4s;
    }
    .l1{ left: 50%; margin-left: -120px; transform: translateX(-50%) rotate(-28deg) scale(.2); }
    .l2{ left: 50%; margin-left: 120px;  transform: translateX(-50%) rotate(208deg) scale(.2); border-radius: 999px 999px 0 999px; transform-origin: 100% 50%; }
    .l3{ left: 50%; margin-left: -40px;  transform: translateX(-50%) rotate(-18deg) scale(.2); }
    .l4{ left: 50%; margin-left: 40px;   transform: translateX(-50%) rotate(198deg) scale(.2); border-radius: 999px 999px 0 999px; transform-origin: 100% 50%; }

    /* ZAMBAK grupları (çoklu çiçek) */
    .lily{
      position:absolute;
      width: 180px;
      height: 220px;
      opacity: 0;
      filter: drop-shadow(0 0 30px var(--glow1));
      animation: lilyBloom 1.6s cubic-bezier(.2,.9,.2,1) forwards;
      transform: scale(.12);
    }

    /* Konumlar */
    .ly1{ left: 50%; bottom: calc(28vh + 120px); transform-origin: 50% 100%; animation-delay: 2.8s; }
    .ly2{ left: 44%; bottom: calc(28vh + 110px); transform-origin: 50% 100%; animation-delay: 3.0s; }
    .ly3{ left: 56%; bottom: calc(28vh + 110px); transform-origin: 50% 100%; animation-delay: 3.1s; }
    .ly4{ left: 38%; bottom: calc(28vh + 95px);  transform-origin: 50% 100%; animation-delay: 3.2s; }
    .ly5{ left: 62%; bottom: calc(28vh + 95px);  transform-origin: 50% 100%; animation-delay: 3.3s; }

    /* Zambak yaprakları (6 büyük petal) */
    .petal{
      position:absolute;
      left:50%;
      top:50%;
      width: 130px;
      height: 46px;
      transform-origin: 0% 50%;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, var(--petal1), var(--petal2) 70%, var(--petal3));
      box-shadow:
        0 0 22px var(--glow2),
        0 0 70px var(--glow3);
      opacity: .98;
    }
    .p1{ transform: translate(-10%,-50%) rotate(0deg); }
    .p2{ transform: translate(-10%,-50%) rotate(60deg); }
    .p3{ transform: translate(-10%,-50%) rotate(120deg); }
    .p4{ transform: translate(-10%,-50%) rotate(180deg); }
    .p5{ transform: translate(-10%,-50%) rotate(240deg); }
    .p6{ transform: translate(-10%,-50%) rotate(300deg); }

    /* Merkez (stamen hissi) */
    .core{
      position:absolute;
      left:50%;
      top:50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%,-50%);
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 0 18px rgba(255,255,255,.8), 0 0 60px rgba(255,255,255,.3);
    }

    /* Glow katmanı (daha güçlü) */
    .glow{
      position:absolute;
      inset:-20px;
      border-radius: 999px;
      background: radial-gradient(circle,
        rgba(255,255,255,.35),
        rgba(255,255,255,.18) 28%,
        rgba(255,255,255,0) 62%);
      opacity: 0;
      animation: glowPulse 2.0s ease-in-out infinite;
      animation-delay: 3.4s;
      filter: blur(0.4px);
    }

    /* Dökülen yapraklar */
    .fall{
      position:absolute;
      left:50%;
      top:50%;
      width: 20px;
      height: 12px;
      border-radius: 999px 999px 999px 6px;
      background: radial-gradient(circle at 30% 30%, #fff, #e9e9e9 70%);
      box-shadow: 0 0 14px rgba(255,255,255,.22);
      opacity: 0;
    }

    /* Birkaç düşüş */
    .f1{ animation: fall1 2.3s ease-in forwards; animation-delay: 5.4s; }
    .f2{ animation: fall2 2.5s ease-in forwards; animation-delay: 5.6s; }
    .f3{ animation: fall3 2.7s ease-in forwards; animation-delay: 5.8s; }
    .f4{ animation: fall4 2.4s ease-in forwards; animation-delay: 6.0s; }
    .f5{ animation: fall5 2.8s ease-in forwards; animation-delay: 6.1s; }
    .f6{ animation: fall6 2.6s ease-in forwards; animation-delay: 6.2s; }

    /* PLAY kontrol: tıklayınca reset */
    .scene:not(.play) .stem,
    .scene:not(.play) .leaf,
    .scene:not(.play) .lily,
    .scene:not(.play) .glow,
    .scene:not(.play) .plant,
    .scene:not(.play) .fall,
    .message:not(.play){
      animation: none !important;
      opacity: 0 !important;
    }
    .scene:not(.play) .stem{ height:0; opacity:1 !important; }

    /* Keyframes */
    @keyframes stemGrow{
      from{ height:0; }
      to{ height: calc(28vh + 140px); } /* orta boy */
    }

    @keyframes leafIn{
      from{ opacity:0; transform: translateX(-50%) rotate(var(--a)) scale(.2); }
      to{ opacity:1; transform: translateX(-50%) rotate(var(--a)) scale(1); }
    }
    .l1,.l3{ --a:-28deg; }
    .l2,.l4{ --a:208deg; }

    @keyframes lilyBloom{
      0%{ opacity:0; transform: translateX(-50%) scale(.12); }
      100%{ opacity:1; transform: translateX(-50%) scale(1); }
    }

    @keyframes glowPulse{
      0%,100%{ opacity:.28; transform: scale(1); filter: blur(0.2px); }
      50%{ opacity:.75; transform: scale(1.08); filter: blur(0.6px); }
    }

    @keyframes wilt{
      0%{ opacity:1; filter:none; transform: translateX(-50%) scale(1) rotate(0deg); }
      100%{ opacity:.12; filter: grayscale(1); transform: translateX(-50%) scale(.90) rotate(-10deg); }
    }

    @keyframes msgIn{
      from{ opacity:0; transform: translateX(-50%) translateY(10px); }
      to{ opacity:1; transform: translateX(-50%) translateY(0); }
    }

    /* Düşüşler */
    @keyframes fall1{
      0%{opacity:0; transform: translate(-50%,-50%) scale(1) rotate(0)}
      10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% - 140px), calc(-50% + 380px)) scale(.85) rotate(260deg)}
    }
    @keyframes fall2{
      0%{opacity:0; transform: translate(-50%,-50%) scale(1) rotate(0)}
      10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% + 160px), calc(-50% + 400px)) scale(.8) rotate(320deg)}
    }
    @keyframes fall3{
      0%{opacity:0; transform: translate(-50%,-50%) scale(1) rotate(0)}
      10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% - 180px), calc(-50% + 420px)) scale(.78) rotate(200deg)}
    }
    @keyframes fall4{
      0%{opacity:0; transform: translate(-50%,-50%) scale(1) rotate(0)}
      10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% + 80px), calc(-50% + 360px)) scale(.9) rotate(260deg)}
    }
    @keyframes fall5{
      0%{opacity:0; transform: translate(-50%,-50%) scale(1) rotate(0)}
      10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% + 200px), calc(-50% + 440px)) scale(.75) rotate(330deg)}
    }
    @keyframes fall6{
      0%{opacity:0; transform: translate(-50%,-50%) scale(1) rotate(0)}
      10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% - 60px), calc(-50% + 400px)) scale(.83) rotate(230deg)}
    }
  </style>
</head>

<body>
  <div class="stage" id="stage" title="Animasyonu yeniden oynat">
    <div class="message" id="message">Mutlu Yıllar</div>

    <div class="scene" id="scene">
      <div class="plant">
        <!-- saplar -->
        <div class="stem s1"></div>
        <div class="stem s2"></div>
        <div class="stem s3"></div>
        <div class="stem s4"></div>
        <div class="stem s5"></div>

        <!-- yapraklar -->
        <div class="leaf l1"></div>
        <div class="leaf l2"></div>
        <div class="leaf l3"></div>
        <div class="leaf l4"></div>

        <!-- zambaklar -->
        <div class="lily ly1">
          <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div>
          <div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div>
          <div class="core"></div><div class="glow"></div>
        </div>

        <div class="lily ly2">
          <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div>
          <div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div>
          <div class="core"></div><div class="glow"></div>
        </div>

        <div class="lily ly3">
          <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div>
          <div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div>
          <div class="core"></div><div class="glow"></div>
        </div>

        <div class="lily ly4">
          <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div>
          <div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div>
          <div class="core"></div><div class="glow"></div>
        </div>

        <div class="lily ly5">
          <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div>
          <div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div>
          <div class="core"></div><div class="glow"></div>
        </div>

        <!-- dökülen yapraklar -->
        <div class="fall f1"></div><div class="fall f2"></div><div class="fall f3"></div>
        <div class="fall f4"></div><div class="fall f5"></div><div class="fall f6"></div>
      </div>
    </div>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const scene = document.getElementById('scene');
    const message = document.getElementById('message');

    function restart(){
      scene.classList.remove('play');
      message.classList.remove('play');
      void scene.offsetWidth; // reset
      scene.classList.add('play');
      message.classList.add('play');
    }

    // Sayfa açılınca otomatik başlat
    restart();

    // Ekrana tıklayınca baştan oynat
    stage.addEventListener('click', restart);
  </script>
</body>
</html>
