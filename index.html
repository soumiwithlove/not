<!DOCTYPE html>
<html lang="tr">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P55R71D5FM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config','G-P55R71D5FM');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not Sayfası</title>

  <style>
    :root{
      --bg:#000;
      --heart:#fff;
      --stem:#22c55e;
      --stemGlow: rgba(34,197,94,.55);
      --petal:#fff;
      --petalShade:#eaeaea;
      --petalGlow1: rgba(255,255,255,.75);
      --petalGlow2: rgba(255,255,255,.25);
      --text:#fff;
    }

    html, body{
      margin:0; padding:0;
      width:100%; height:100%;
      background: var(--bg);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      font-family: Arial, sans-serif;
    }

    /* Tetikleyici: kalp */
    .trigger{
      position: relative;
      width: 64px;
      height: 64px;
      cursor: pointer;
      user-select: none;
      filter: drop-shadow(0 0 14px rgba(255,255,255,.18));
    }

    .heart{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      color: var(--heart);
      font-size: 44px;
      line-height: 1;
    }

    /* Sahne kalbin üstünde */
    .scene{
      position:absolute;
      left:50%;
      bottom: 100%;
      transform: translateX(-50%);
      width: 260px;
      height: 320px;
      pointer-events:none;
    }

    /* Bitki */
    .plant{
      position:absolute;
      left:50%;
      bottom: 20px;
      transform: translateX(-50%);
      width: 240px;
      height: 280px;
      transform-origin: 50% 100%;
      opacity: 1;
    }

    /* Filiz sapı */
    .stem{
      position:absolute;
      left:50%;
      bottom:0;
      width: 7px;
      height: 0px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(#1aa251, var(--stem));
      box-shadow: 0 0 18px var(--stemGlow);
      animation: stemGrow 2.0s cubic-bezier(.2,.9,.2,1) forwards;
    }

    /* Yapraklar */
    .leaf{
      position:absolute;
      left:50%;
      bottom: 120px;
      width: 62px;
      height: 34px;
      opacity: 0;
      background: radial-gradient(circle at 30% 35%, #53e08c, #1aa251 70%);
      box-shadow: 0 0 14px rgba(34,197,94,.25);
      border-radius: 999px 999px 999px 0;
      transform-origin: 0% 50%;
      animation: leafIn .9s ease-out forwards;
      animation-delay: 1.0s;
    }
    .leaf.left{
      transform: translateX(-50%) rotate(-26deg) scale(.2);
      margin-left: -24px;
    }
    .leaf.right{
      transform: translateX(-50%) rotate(206deg) scale(.2);
      margin-left: 24px;
      border-radius: 999px 999px 0 999px;
      transform-origin: 100% 50%;
    }

    /* Çiçek kafası (görkemli) */
    .flower{
      position:absolute;
      left:50%;
      bottom: 165px;
      width: 170px;
      height: 170px;
      transform: translateX(-50%) scale(.15);
      opacity: 0;
      filter: drop-shadow(0 0 22px var(--petalGlow1));
      animation: bloom 1.4s cubic-bezier(.2,.9,.2,1) forwards;
      animation-delay: 2.2s;
    }

    /* 12 petal: çiçek daha dolu görünür */
    .petal{
      position:absolute;
      left:50%;
      top:50%;
      width: 92px;
      height: 34px;
      transform-origin: 0% 50%;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 35%, var(--petal), var(--petalShade) 75%);
      box-shadow:
        0 0 18px var(--petalGlow1),
        0 0 46px var(--petalGlow2);
      opacity: .96;
    }

    /* Petal açıları */
    .p1{  transform: translate(-8%,-50%) rotate(0deg); }
    .p2{  transform: translate(-8%,-50%) rotate(30deg); }
    .p3{  transform: translate(-8%,-50%) rotate(60deg); }
    .p4{  transform: translate(-8%,-50%) rotate(90deg); }
    .p5{  transform: translate(-8%,-50%) rotate(120deg); }
    .p6{  transform: translate(-8%,-50%) rotate(150deg); }
    .p7{  transform: translate(-8%,-50%) rotate(180deg); }
    .p8{  transform: translate(-8%,-50%) rotate(210deg); }
    .p9{  transform: translate(-8%,-50%) rotate(240deg); }
    .p10{ transform: translate(-8%,-50%) rotate(270deg); }
    .p11{ transform: translate(-8%,-50%) rotate(300deg); }
    .p12{ transform: translate(-8%,-50%) rotate(330deg); }

    /* Çiçek merkezi */
    .center{
      position:absolute;
      left:50%;
      top:50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%,-50%);
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 0 16px rgba(255,255,255,.75),
                  0 0 36px rgba(255,255,255,.25);
    }

    /* Parıltı katmanı */
    .glow{
      position:absolute;
      inset:-10px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(255,255,255,.18), rgba(255,255,255,0) 60%);
      opacity: 0;
      animation: glowPulse 2.1s ease-in-out infinite;
      animation-delay: 2.6s;
    }

    /* Dökülen petaller (fall) */
    .fall{
      position:absolute;
      left:50%;
      top: 50%;
      width: 14px;
      height: 10px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 35%, #fff, #e9e9e9 75%);
      box-shadow: 0 0 12px rgba(255,255,255,.25);
      opacity: 0;
    }

    /* 7 tane dökülen petal */
    .f1{ animation: fall1 2.2s ease-in forwards; animation-delay: 4.8s; }
    .f2{ animation: fall2 2.4s ease-in forwards; animation-delay: 5.0s; }
    .f3{ animation: fall3 2.6s ease-in forwards; animation-delay: 5.1s; }
    .f4{ animation: fall4 2.3s ease-in forwards; animation-delay: 5.2s; }
    .f5{ animation: fall5 2.7s ease-in forwards; animation-delay: 5.25s; }
    .f6{ animation: fall6 2.5s ease-in forwards; animation-delay: 5.35s; }
    .f7{ animation: fall7 2.8s ease-in forwards; animation-delay: 5.45s; }

    /* Solma: bitkinin tamamı */
    .plant{
      animation: wilt 1.8s ease-in forwards;
      animation-delay: 5.6s;
    }

    /* Yazı */
    .message{
      position: fixed;
      left:50%;
      top:50%;
      transform: translate(-50%,-50%) translateY(10px);
      color: var(--text);
      font-weight: 800;
      letter-spacing: .8px;
      font-size: clamp(30px, 5vw, 62px);
      opacity: 0;
      white-space: nowrap;
      text-shadow: 0 0 18px rgba(255,255,255,.35),
                   0 0 44px rgba(255,255,255,.2);
      pointer-events: none;
      animation: msgIn 1.1s ease-out forwards;
      animation-delay: 7.8s;
    }

    .hint{
      position: fixed;
      left:50%;
      bottom: 26px;
      transform: translateX(-50%);
      color: rgba(255,255,255,.55);
      font-size: 13px;
      letter-spacing: .3px;
      user-select:none;
    }

    /* play kontrolü: reset için */
    .scene:not(.play) .stem,
    .scene:not(.play) .leaf,
    .scene:not(.play) .flower,
    .scene:not(.play) .glow,
    .scene:not(.play) .plant,
    .scene:not(.play) .fall,
    .message:not(.play){
      animation: none !important;
      opacity: 0 !important;
    }
    .scene:not(.play) .stem{ height:0; opacity:1 !important; }

    /* Keyframes */
    @keyframes stemGrow { from{height:0} to{height:210px} }
    @keyframes leafIn {
      from{opacity:0; transform: translateX(-50%) rotate(var(--a)) scale(.2);}
      to{opacity:1; transform: translateX(-50%) rotate(var(--a)) scale(1);}
    }
    .leaf.left{ --a:-26deg; }
    .leaf.right{ --a:206deg; }

    @keyframes bloom{
      0%{opacity:0; transform: translateX(-50%) scale(.15);}
      100%{opacity:1; transform: translateX(-50%) scale(1);}
    }

    @keyframes glowPulse{
      0%,100%{ opacity:.18; transform: scale(1); }
      50%{ opacity:.48; transform: scale(1.06); }
    }

    @keyframes wilt{
      0%{ opacity:1; filter:none; transform: translateX(-50%) scale(1) rotate(0deg); }
      100%{ opacity:.18; filter: grayscale(1); transform: translateX(-50%) scale(.92) rotate(-10deg); }
    }

    @keyframes msgIn{
      from{ opacity:0; transform: translate(-50%,-50%) translateY(10px); }
      to{ opacity:1; transform: translate(-50%,-50%) translateY(0); }
    }

    /* Düşüş animasyonları (rastgele yöne) */
    @keyframes fall1{ 0%{opacity:0; transform: translate(-50%,-50%) scale(1) rotate(0)} 10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% - 90px), calc(-50% + 220px)) scale(.85) rotate(240deg)} }
    @keyframes fall2{ 0%{opacity:0; transform: translate(-50%,-50%) scale(1) rotate(0)} 10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% + 120px), calc(-50% + 240px)) scale(.8) rotate(310deg)} }
    @keyframes fall3{ 0%{opacity:0; transform: translate(-50%,-50%) scale(1) rotate(0)} 10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% - 150px), calc(-50% + 260px)) scale(.78) rotate(190deg)} }
    @keyframes fall4{ 0%{opacity:0; transform: translate(-50%,-50%) scale(1) rotate(0)} 10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% + 60px), calc(-50% + 210px)) scale(.9) rotate(260deg)} }
    @keyframes fall5{ 0%{opacity:0; transform: translate(-50%,-50%) scale(1) rotate(0)} 10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% + 170px), calc(-50% + 270px)) scale(.75) rotate(330deg)} }
    @keyframes fall6{ 0%{opacity:0; transform: translate(-50%,-50%) scale(1) rotate(0)} 10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% - 40px), calc(-50% + 250px)) scale(.83) rotate(220deg)} }
    @keyframes fall7{ 0%{opacity:0; transform: translate(-50%,-50%) scale(1) rotate(0)} 10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% + 20px), calc(-50% + 290px)) scale(.7) rotate(280deg)} }
  </style>
</head>

<body>
  <div class="trigger" id="trigger" aria-label="Animasyonu başlat">
    <div class="heart">♥</div>

    <div class="scene" id="scene">
      <div class="plant">
        <div class="stem"></div>
        <div class="leaf left"></div>
        <div class="leaf right"></div>

        <div class="flower">
          <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div>
          <div class="petal p5"></div><div class="petal p6"></div><div class="petal p7"></div><div class="petal p8"></div>
          <div class="petal p9"></div><div class="petal p10"></div><div class="petal p11"></div><div class="petal p12"></div>
          <div class="center"></div>
          <div class="glow"></div>

          <!-- dökülen yaprak/petaller -->
          <div class="fall f1"></div><div class="fall f2"></div><div class="fall f3"></div>
          <div class="fall f4"></div><div class="fall f5"></div><div class="fall f6"></div><div class="fall f7"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="message" id="message">Mutlu Yıllar</div>
  <div class="hint">Kalbe tıkla</div>

  <script>
    const trigger = document.getElementById('trigger');
    const scene = document.getElementById('scene');
    const msg = document.getElementById('message');

    function restart(){
      scene.classList.remove('play');
      msg.classList.remove('play');
      void scene.offsetWidth; // reset
      scene.classList.add('play');
      msg.classList.add('play');
    }

    // Açılışta otomatik
    restart();

    // Tıklayınca baştan
    trigger.addEventListener('click', restart);
  </script>
</body>
</html>
