<!DOCTYPE html>
<html lang="tr">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P55R71D5FM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config','G-P55R71D5FM');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not Sayfası</title>

  <style>
    :root{
      --bg:#000;
      --stem:#22c55e;
      --stemGlow: rgba(34,197,94,.7);

      /* Gül: beyaz + hafif kırık beyaz gölge */
      --rose1:#ffffff;
      --rose2:#f1f1f1;
      --rose3:#e6e6e6;

      /* Glow güçlendirildi */
      --glow1: rgba(255,255,255,.95);
      --glow2: rgba(255,255,255,.55);
      --glow3: rgba(255,255,255,.25);

      --text:#fff;
    }

    html, body{
      margin:0; padding:0;
      width:100%; height:100%;
      background: var(--bg);
      overflow:hidden;
      font-family: Arial, sans-serif;
    }

    /* Tüm ekran tıklanabilir: refresh yok, restart var */
    .stage{
      position: fixed;
      inset: 0;
      cursor: pointer;
      user-select: none;
    }

    /* Mesaj üstte, solma bittikten sonra */
    .message{
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      color: var(--text);
      font-weight: 800;
      letter-spacing: .8px;
      font-size: clamp(26px, 4.5vw, 54px);
      opacity: 0;
      white-space: nowrap;
      text-shadow:
        0 0 18px rgba(255,255,255,.40),
        0 0 48px rgba(255,255,255,.22);
      pointer-events: none;
      animation: msgIn 1.1s ease-out forwards;
      animation-delay: 8.1s; /* solma + dökülme sonrası */
    }

    .hint{
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      color: rgba(255,255,255,.55);
      font-size: 13px;
      letter-spacing: .3px;
      user-select:none;
      pointer-events:none;
    }

    /* Sahne: çiçek en alttan büyür */
    .scene{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 78vh;
      pointer-events: none;
    }

    /* Bitki kökü */
    .plant{
      position:absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 260px;
      height: 78vh;
      transform-origin: 50% 100%;
      opacity: 1;
      animation: wilt 1.9s ease-in forwards;
      animation-delay: 6.2s;
    }

    /* Sap */
    .stem{
      position:absolute;
      left: 50%;
      bottom: 0;
      width: 8px;
      height: 0px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(#179a4b, var(--stem));
      box-shadow: 0 0 22px var(--stemGlow);
      animation: stemGrow 2.2s cubic-bezier(.2,.9,.2,1) forwards;
    }

    /* Yapraklar */
    .leaf{
      position:absolute;
      left:50%;
      bottom: 24vh;
      width: 72px;
      height: 38px;
      opacity: 0;
      background: radial-gradient(circle at 30% 35%, #53e08c, #179a4b 70%);
      box-shadow: 0 0 18px rgba(34,197,94,.30);
      border-radius: 999px 999px 999px 0;
      transform-origin: 0% 50%;
      animation: leafIn .9s ease-out forwards;
      animation-delay: 1.2s;
    }
    .leaf.left{
      margin-left: -34px;
      transform: translateX(-50%) rotate(-26deg) scale(.2);
    }
    .leaf.right{
      margin-left: 34px;
      transform: translateX(-50%) rotate(206deg) scale(.2);
      border-radius: 999px 999px 0 999px;
      transform-origin: 100% 50%;
    }

    /* GÜL */
    .rose{
      position:absolute;
      left:50%;
      bottom: calc(24vh + 110px);
      width: 220px;
      height: 220px;
      transform: translateX(-50%) scale(.12);
      opacity: 0;
      filter: drop-shadow(0 0 28px var(--glow1));
      animation: roseBloom 1.5s cubic-bezier(.2,.9,.2,1) forwards;
      animation-delay: 2.7s;
    }

    /* Glow katmanı (arttırıldı) */
    .roseGlow{
      position:absolute;
      inset:-18px;
      border-radius: 999px;
      background: radial-gradient(circle,
        rgba(255,255,255,.30),
        rgba(255,255,255,.16) 28%,
        rgba(255,255,255,0) 62%);
      opacity: 0;
      animation: glowPulse 1.9s ease-in-out infinite;
      animation-delay: 3.2s;
      filter: blur(0.3px);
    }

    /* Gül yaprakları: katman katman */
    .petal{
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%,-50%);
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, var(--rose1), var(--rose2) 70%, var(--rose3));
      box-shadow:
        0 0 20px var(--glow2),
        0 0 60px var(--glow3);
      opacity: .98;
      filter: saturate(.9);
    }

    /* Dış yapraklar */
    .pA{ width: 170px; height: 92px; transform: translate(-50%,-50%) rotate(10deg); }
    .pB{ width: 170px; height: 92px; transform: translate(-50%,-50%) rotate(55deg); }
    .pC{ width: 170px; height: 92px; transform: translate(-50%,-50%) rotate(100deg); }
    .pD{ width: 170px; height: 92px; transform: translate(-50%,-50%) rotate(145deg); }

    /* Orta katman */
    .pE{ width: 135px; height: 74px; transform: translate(-50%,-50%) rotate(25deg); }
    .pF{ width: 135px; height: 74px; transform: translate(-50%,-50%) rotate(85deg); }
    .pG{ width: 135px; height: 74px; transform: translate(-50%,-50%) rotate(145deg); }
    .pH{ width: 135px; height: 74px; transform: translate(-50%,-50%) rotate(205deg); }

    /* İç katman */
    .pI{ width: 98px; height: 56px; transform: translate(-50%,-50%) rotate(40deg); }
    .pJ{ width: 98px; height: 56px; transform: translate(-50%,-50%) rotate(110deg); }
    .pK{ width: 98px; height: 56px; transform: translate(-50%,-50%) rotate(180deg); }

    /* Gül tomurcuğu (merkez) */
    .core{
      position:absolute;
      left:50%;
      top:50%;
      width: 40px;
      height: 40px;
      transform: translate(-50%,-50%) rotate(18deg);
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #fff, #ececec 75%);
      box-shadow: 0 0 18px rgba(255,255,255,.7), 0 0 55px rgba(255,255,255,.22);
    }

    /* Dökülen yapraklar (gül yaprağı gibi) */
    .fall{
      position:absolute;
      left:50%;
      top:50%;
      width: 18px;
      height: 12px;
      border-radius: 999px 999px 999px 6px;
      background: radial-gradient(circle at 30% 30%, #fff, #e9e9e9 70%);
      box-shadow: 0 0 14px rgba(255,255,255,.22);
      opacity: 0;
    }

    .f1{ animation: fall1 2.2s ease-in forwards; animation-delay: 4.9s; }
    .f2{ animation: fall2 2.4s ease-in forwards; animation-delay: 5.0s; }
    .f3{ animation: fall3 2.6s ease-in forwards; animation-delay: 5.15s; }
    .f4{ animation: fall4 2.3s ease-in forwards; animation-delay: 5.25s; }
    .f5{ animation: fall5 2.7s ease-in forwards; animation-delay: 5.35s; }
    .f6{ animation: fall6 2.5s ease-in forwards; animation-delay: 5.45s; }
    .f7{ animation: fall7 2.8s ease-in forwards; animation-delay: 5.55s; }

    /* PLAY kontrol (tıklayınca reset) */
    .scene:not(.play) .stem,
    .scene:not(.play) .leaf,
    .scene:not(.play) .rose,
    .scene:not(.play) .roseGlow,
    .scene:not(.play) .plant,
    .scene:not(.play) .fall,
    .message:not(.play){
      animation: none !important;
      opacity: 0 !important;
    }
    .scene:not(.play) .stem{ height:0; opacity:1 !important; }

    /* Keyframes */
    @keyframes stemGrow{
      from{ height:0; }
      to{ height: calc(24vh + 160px); }
    }

    @keyframes leafIn{
      from{ opacity:0; transform: translateX(-50%) rotate(var(--a)) scale(.2); }
      to{ opacity:1; transform: translateX(-50%) rotate(var(--a)) scale(1); }
    }
    .leaf.left{ --a:-26deg; }
    .leaf.right{ --a:206deg; }

    @keyframes roseBloom{
      0%{ opacity:0; transform: translateX(-50%) scale(.12); }
      100%{ opacity:1; transform: translateX(-50%) scale(1); }
    }

    @keyframes glowPulse{
      0%,100%{ opacity:.25; transform: scale(1); filter: blur(0.2px); }
      50%{ opacity:.70; transform: scale(1.08); filter: blur(0.6px); }
    }

    @keyframes wilt{
      0%{ opacity:1; filter:none; transform: translateX(-50%) scale(1) rotate(0deg); }
      100%{ opacity:.14; filter: grayscale(1); transform: translateX(-50%) scale(.90) rotate(-10deg); }
    }

    @keyframes msgIn{
      from{ opacity:0; transform: translateX(-50%) translateY(10px); }
      to{ opacity:1; transform: translateX(-50%) translateY(0); }
    }

    /* Düşüşler (petal dökülme) */
    @keyframes fall1{
      0%{opacity:0; transform: translate(-50%,-50%) scale(1) rotate(0)}
      10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% - 120px), calc(-50% + 340px)) scale(.85) rotate(260deg)}
    }
    @keyframes fall2{
      0%{opacity:0; transform: translate(-50%,-50%) scale(1) rotate(0)}
      10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% + 140px), calc(-50% + 360px)) scale(.8) rotate(320deg)}
    }
    @keyframes fall3{
      0%{opacity:0; transform: translate(-50%,-50%) scale(1) rotate(0)}
      10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% - 170px), calc(-50% + 380px)) scale(.78) rotate(200deg)}
    }
    @keyframes fall4{
      0%{opacity:0; transform: translate(-50%,-50%) scale(1) rotate(0)}
      10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% + 70px), calc(-50% + 330px)) scale(.9) rotate(260deg)}
    }
    @keyframes fall5{
      0%{opacity:0; transform: translate(-50%,-50%) scale(1) rotate(0)}
      10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% + 190px), calc(-50% + 400px)) scale(.75) rotate(330deg)}
    }
    @keyframes fall6{
      0%{opacity:0; transform: translate(-50%,-50%) scale(1) rotate(0)}
      10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% - 60px), calc(-50% + 370px)) scale(.83) rotate(230deg)}
    }
    @keyframes fall7{
      0%{opacity:0; transform: translate(-50%,-50%) scale(1) rotate(0)}
      10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% + 20px), calc(-50% + 420px)) scale(.7) rotate(285deg)}
    }
  </style>
</head>

<body>
  <div class="stage" id="stage" title="Animasyonu yeniden oynat">
    <div class="message" id="message">Mutlu Yıllar</div>
    <div class="hint">Tıkla: animasyon baştan oynar</div>

    <div class="scene" id="scene">
      <div class="plant">
        <div class="stem"></div>
        <div class="leaf left"></div>
        <div class="leaf right"></div>

        <div class="rose">
          <div class="petal pA"></div><div class="petal pB"></div><div class="petal pC"></div><div class="petal pD"></div>
          <div class="petal pE"></div><div class="petal pF"></div><div class="petal pG"></div><div class="petal pH"></div>
          <div class="petal pI"></div><div class="petal pJ"></div><div class="petal pK"></div>
          <div class="core"></div>
          <div class="roseGlow"></div>

          <!-- dökülen yapraklar -->
          <div class="fall f1"></div><div class="fall f2"></div><div class="fall f3"></div>
          <div class="fall f4"></div><div class="fall f5"></div><div class="fall f6"></div><div class="fall f7"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const scene = document.getElementById('scene');
    const message = document.getElementById('message');

    function restart(){
      scene.classList.remove('play');
      message.classList.remove('play');
      void scene.offsetWidth; // reflow reset
      scene.classList.add('play');
      message.classList.add('play');
    }

    // Sayfa açılınca otomatik başlat
    restart();

    // Ekrana tıklayınca baştan oynat (sayfa yenilenmez)
    stage.addEventListener('click', restart);
  </script>
</body>
</html>
