<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Beyaz Gül Animasyonu - Yeni Yıl</title>
    <style>
        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Çiçeği en alta yasladık */
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .container { 
            position: relative; 
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* Çimenlik/Zemin Alanı */
        .grass {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 20px;
            background: linear-gradient(to top, #0a1a0a, transparent);
            z-index: 1;
        }

        /* Çiçek Sapı - En alttan başlar */
        .stem {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 4px;
            height: 0;
            background: linear-gradient(to top, #132a13, #2d5a27);
            transform: translateX(-50%);
            animation: grow-stem 6s forwards cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Yapraklar */
        .leaf {
            position: absolute;
            width: 40px;
            height: 20px;
            background: #2d5a27;
            border-radius: 0 25px;
            opacity: 0;
            animation: show 2s 3.5s forwards;
        }
        .l1 { left: -35px; bottom: 120px; transform: rotate(15deg); }
        .l2 { right: -35px; bottom: 180px; transform: rotate(-15deg) scaleX(-1); }
        .l3 { left: -30px; bottom: 250px; transform: rotate(25deg); }

        /* Beyaz Gül Başlığı */
        .rose-head {
            position: absolute;
            top: -55px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 70px;
            height: 65px;
            animation: bloom 4s 5s forwards;
        }

        .petal {
            position: absolute;
            background: #ffffff;
            border-radius: 20% 20% 50% 50% / 80% 80% 20% 20%;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.8);
            transform-origin: bottom center;
        }
        
        .p1 { transform: scale(1); z-index: 5; }
        .p2 { transform: scale(1.1) rotate(25deg); z-index: 4; background: #fcfcfc; }
        .p3 { transform: scale(1.1) rotate(-25deg); z-index: 4; background: #fcfcfc; }
        .p4 { transform: scale(1.2) rotate(45deg); z-index: 3; background: #f9f9f9; }
        .p5 { transform: scale(1.2) rotate(-45deg); z-index: 3; background: #f9f9f9; }

        /* Mesaj Yazısı - Tam Ortada */
        #message {
            position: absolute;
            top: 40%; /* Ekranın üst kısmına yakın orta */
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 3rem;
            font-weight: 200;
            letter-spacing: 8px;
            opacity: 0;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
            white-space: nowrap;
            z-index: 10;
            pointer-events: none;
        }

        /* Düşen Yaprak */
        .falling-petal {
            position: absolute;
            width: 20px;
            height: 15px;
            background: #ffffff;
            border-radius: 50% 0 50% 0;
            opacity: 0;
            z-index: 6;
        }

        /* Animasyonlar */
        @keyframes grow-stem { 
            to { height: 350px; } /* Boyu biraz uzattık */
        }
        
        @keyframes show { to { opacity: 1; } }
        
        @keyframes bloom { 
            to { transform: translateX(-50%) scale(1); } 
        }

        @keyframes petal-fall {
            0% { opacity: 0; transform: translate(0, 0) rotate(0); }
            20% { opacity: 1; }
            100% { opacity: 0; transform: translate(100px, 400px) rotate(200deg); }
        }

        .fade-in-text { animation: final-text 3s forwards ease-in-out; }
        @keyframes final-text { to { opacity: 1; } }
        
        .fall-trigger { animation: petal-fall 6s forwards linear; }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="message">MUTLU YILLAR</h1>
        
        <div class="grass"></div>

        <div class="stem">
            <div class="leaf l1"></div>
            <div class="leaf l2"></div>
            <div class="leaf l3"></div>
            
            <div class="rose-head">
                <div class="petal p1"></div>
                <div class="petal p2"></div>
                <div class="petal p3"></div>
                <div class="petal p4"></div>
                <div class="petal p5"></div>
            </div>
            
            <div class="falling-petal" id="petal1" style="top: 0; left: 0;"></div>
        </div>
    </div>

    <script>
        // Yaprak düşme zamanlaması (Gül açtıktan sonra)
        setTimeout(() => {
            document.getElementById('petal1').classList.add('fall-trigger');
        }, 9000);

        // Mesajın görünme zamanlaması
        setTimeout(() => {
            document.getElementById('message').classList.add('fade-in-text');
        }, 11000);
    </script>
</body>
</html>
