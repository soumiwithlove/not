<!DOCTYPE html>
<html lang="tr">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-P55R71D5FM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-P55R71D5FM');
    </script>

    <meta charset="UTF-8">
    <title>Zarif Beyaz Gül - Yeni Yıl</title>
    <style>
        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .container { 
            position: relative; 
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* Çimenlik/Zemin */
        .grass {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 30px;
            background: linear-gradient(to top, #0a1a0a, transparent);
            z-index: 1;
        }

        /* Sap */
        .stem {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 4px;
            height: 0;
            background: linear-gradient(to top, #132a13, #2d5a27);
            transform: translateX(-50%);
            animation: grow-stem 6s forwards cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Yapraklar */
        .leaf {
            position: absolute;
            width: 35px;
            height: 18px;
            background: #2d5a27;
            border-radius: 0 20px;
            opacity: 0;
            animation: show 2s 3.5s forwards;
        }
        .l1 { left: -32px; bottom: 100px; transform: rotate(20deg); }
        .l2 { right: -32px; bottom: 160px; transform: rotate(-20deg) scaleX(-1); }

        /* Geliştirilmiş Gül Başlığı */
        .rose-head {
            position: absolute;
            top: -65px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 60px;
            height: 80px;
            animation: bloom 4s 5s forwards, wither 6s 14s forwards;
        }

        /* Yeni Form: Havaya Bakan Yapraklar */
        .petal {
            position: absolute;
            background: #ffffff;
            border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            border: 1px solid rgba(230,230,230,0.5);
            transform-origin: bottom center;
            opacity: 0.95;
        }
        
        /* Yaprak Dizilimi - Daha Dik ve Zarif */
        .p1 { transform: scale(0.8); z-index: 6; background: #fff; } /* Merkez */
        .p2 { transform: rotate(15deg) scale(0.9); z-index: 5; background: #fafafa; }
        .p3 { transform: rotate(-15deg) scale(0.9); z-index: 5; background: #fafafa; }
        .p4 { transform: rotate(30deg) scale(1); z-index: 4; background: #f5f5f5; }
        .p5 { transform: rotate(-30deg) scale(1); z-index: 4; background: #f5f5f5; }

        /* Mesaj Yazısı */
        #message {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 3rem;
            font-weight: 200;
            letter-spacing: 10px;
            opacity: 0;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            z-index: 10;
        }

        /* Düşen Yaprak */
        .falling-petal {
            position: absolute;
            width: 15px;
            height: 20px;
            background: #f0f0f0;
            border-radius: 50% 0 50% 0;
            opacity: 0;
            z-index: 7;
        }

        /* Animasyonlar */
        @keyframes grow-stem { to { height: 380px; } }
        
        @keyframes show { to { opacity: 1; } }
        
        @keyframes bloom { 
            0% { transform: translateX(-50%) scale(0); }
            100% { transform: translateX(-50%) scale(1.1); } 
        }

        /* Solma Efekti: Kararma ve Boyun Bükme */
        @keyframes wither {
            100% { 
                transform: translateX(-50%) rotate(25deg) translateY(20px);
                filter: brightness(0.4) sepia(0.5);
                opacity: 0.7;
            }
        }

        @keyframes petal-fall {
            0% { opacity: 0; transform: translate(0, 0) rotate(0); }
            10% { opacity: 1; }
            100% { opacity: 0; transform: translate(80px, 450px) rotate(360deg); }
        }

        .fade-in-text { animation: final-text 4s forwards ease-in-out; }
        @keyframes final-text { to { opacity: 1; } }
        
        .fall-trigger { animation: petal-fall 8s forwards linear; }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="message">MUTLU YILLAR</h1>
        
        <div class="grass"></div>

        <div class="stem">
            <div class="leaf l1"></div>
            <div class="leaf l2"></div>
            
            <div class="rose-head">
                <div class="petal p1"></div>
                <div class="petal p2"></div>
                <div class="petal p3"></div>
                <div class="petal p4"></div>
                <div class="petal p5"></div>
            </div>
            
            <div class="falling-petal" id="petal1" style="top: 0; left: 0;"></div>
        </div>
    </div>

    <script>
        // Yaprak düşme zamanlaması (Solma başladığında)
        setTimeout(() => {
            document.getElementById('petal1').classList.add('fall-trigger');
        }, 13000);

        // Mesajın görünme zamanlaması
        setTimeout(() => {
            document.getElementById('message').classList.add('fade-in-text');
        }, 8000);
    </script>
</body>
</html>
