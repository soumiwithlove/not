<!DOCTYPE html>
<html lang="tr">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P55R71D5FM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config','G-P55R71D5FM');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#000;
      --glass: rgba(255,255,255,.18);
      --glassEdge: rgba(255,255,255,.55);
      --innerGlow: rgba(255,255,255,.12);
      --rose:#ff3b57;
      --rose2:#ff2748;
      --stem:#22c55e;
      --stem2:#179a4b;
      --spark: rgba(255,255,255,.55);
    }

    html,body{
      width:100%; height:100%;
      margin:0; padding:0;
      background: var(--bg);
      overflow:hidden;
      font-family: Poppins, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* Tüm ekran: tıkla restart */
    .stage{
      position:fixed; inset:0;
      display:grid;
      place-items:center;
      cursor:pointer;
      user-select:none;
    }

    /* Mutlu Yıllar - ince font */
    .title{
      position:fixed;
      top: 34px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      font-weight: 200;
      font-size: clamp(26px, 4.5vw, 54px);
      letter-spacing: .8px;
      color: rgba(255,255,255,.92);
      opacity: 0;
      text-shadow:
        0 0 14px rgba(255,255,255,.25),
        0 0 46px rgba(255,255,255,.15);
      pointer-events:none;
      animation: titleIn 1.2s ease-out forwards;
      animation-delay: 8.2s;
      white-space: nowrap;
    }

    /* Cam kubbe */
    .dome{
      width: 280px;
      height: 360px;
      position: relative;
      display:grid;
      place-items:center;
      filter: drop-shadow(0 0 30px rgba(255,255,255,.10));
    }

    .glass{
      position:absolute;
      inset: 10px 22px 56px 22px;
      border-radius: 160px 160px 26px 26px;
      border: 2px solid var(--glassEdge);
      background:
        radial-gradient(circle at 50% 28%, rgba(255,255,255,.22), rgba(255,255,255,0) 55%),
        linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.12),
        inset 0 0 38px rgba(255,255,255,.06);
      overflow:hidden;
    }

    /* Cam yansıması */
    .glass::before{
      content:"";
      position:absolute;
      top: 10%;
      left: 14%;
      width: 28%;
      height: 55%;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0));
      transform: rotate(10deg);
      opacity: .55;
      filter: blur(.2px);
    }

    /* Tabana çizgi */
    .base{
      position:absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      width: 250px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255,255,255,.15), rgba(255,255,255,.45), rgba(255,255,255,.15));
      opacity: .8;
    }

    /* İç sahne */
    .scene{
      position:absolute;
      inset: 10px 22px 56px 22px;
      pointer-events:none;
    }

    /* Arka glow */
    .halo{
      position:absolute;
      left:50%;
      top: 34%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(255,255,255,.14), rgba(255,255,255,0) 62%);
      opacity: 0;
      animation: haloPulse 2.2s ease-in-out infinite;
      animation-delay: 1.8s;
    }

    /* Gül grubu */
    .rose{
      position:absolute;
      left:50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: 220px;
      height: 290px;
      transform-origin: 50% 100%;
      animation: wilt 1.8s ease-in forwards;
      animation-delay: 6.4s;
    }

    /* Sap */
    .stem{
      position:absolute;
      left:50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 8px;
      height: 0;
      border-radius: 999px;
      background: linear-gradient(var(--stem2), var(--stem));
      box-shadow: 0 0 18px rgba(34,197,94,.35);
      animation: grow 2.2s cubic-bezier(.2,.9,.2,1) forwards;
    }

    /* Yaprak */
    .leaf{
      position:absolute;
      left:50%;
      bottom: 110px;
      width: 70px;
      height: 36px;
      opacity: 0;
      background: radial-gradient(circle at 30% 35%, #53e08c, #179a4b 70%);
      box-shadow: 0 0 14px rgba(34,197,94,.22);
      border-radius: 999px 999px 999px 0;
      transform-origin: 0% 50%;
      animation: leafIn .9s ease-out forwards;
      animation-delay: 1.1s;
    }
    .leaf.left{
      margin-left: -44px;
      transform: translateX(-50%) rotate(-26deg) scale(.2);
    }
    .leaf.right{
      margin-left: 44px;
      transform: translateX(-50%) rotate(206deg) scale(.2);
      border-radius: 999px 999px 0 999px;
      transform-origin: 100% 50%;
    }

    /* Gül başı */
    .head{
      position:absolute;
      left:50%;
      bottom: 160px;
      width: 170px;
      height: 170px;
      transform: translateX(-50%) scale(.12);
      opacity: 0;
      filter: drop-shadow(0 0 22px rgba(255,255,255,.22));
      animation: bloom 1.4s cubic-bezier(.2,.9,.2,1) forwards;
      animation-delay: 2.2s;
    }

    /* Petal katmanları (gül hissi) */
    .petal{
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%,-50%);
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, var(--rose), var(--rose2) 70%, #d9142e);
      box-shadow:
        0 0 18px rgba(255,59,87,.25),
        0 0 26px rgba(255,255,255,.15);
      opacity: .98;
    }

    /* Dış katman */
    .pA{ width: 150px; height: 78px; transform: translate(-50%,-50%) rotate(10deg); }
    .pB{ width: 150px; height: 78px; transform: translate(-50%,-50%) rotate(55deg); }
    .pC{ width: 150px; height: 78px; transform: translate(-50%,-50%) rotate(100deg); }
    .pD{ width: 150px; height: 78px; transform: translate(-50%,-50%) rotate(145deg); }

    /* Orta katman */
    .pE{ width: 120px; height: 64px; transform: translate(-50%,-50%) rotate(25deg); }
    .pF{ width: 120px; height: 64px; transform: translate(-50%,-50%) rotate(85deg); }
    .pG{ width: 120px; height: 64px; transform: translate(-50%,-50%) rotate(145deg); }
    .pH{ width: 120px; height: 64px; transform: translate(-50%,-50%) rotate(205deg); }

    /* İç katman */
    .pI{ width: 86px; height: 50px; transform: translate(-50%,-50%) rotate(35deg); }
    .pJ{ width: 86px; height: 50px; transform: translate(-50%,-50%) rotate(110deg); }
    .pK{ width: 86px; height: 50px; transform: translate(-50%,-50%) rotate(185deg); }

    .core{
      position:absolute;
      left:50%;
      top:50%;
      width: 34px;
      height: 34px;
      transform: translate(-50%,-50%) rotate(18deg);
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #ff5f75, #e31b3a 78%);
      box-shadow: 0 0 22px rgba(255,59,87,.25);
    }

    /* Parıltı (daha fazla) */
    .sparkRing{
      position:absolute;
      inset:-18px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(255,255,255,.20), rgba(255,255,255,.08) 28%, rgba(255,255,255,0) 62%);
      opacity: 0;
      animation: sparkle 2.0s ease-in-out infinite;
      animation-delay: 2.7s;
      filter: blur(.3px);
    }

    /* Düşen yapraklar: hepsi dökülüyor hissi */
    .fall{
      position:absolute;
      left:50%;
      top:50%;
      width: 22px;
      height: 14px;
      border-radius: 999px 999px 999px 8px;
      background: radial-gradient(circle at 30% 30%, var(--rose), var(--rose2) 75%, #d9142e);
      box-shadow: 0 0 14px rgba(255,59,87,.18);
      opacity: 0;
      filter: drop-shadow(0 0 10px rgba(255,255,255,.12));
    }

    /* 10 adet dökülme */
    .f1{ animation: fall1 2.6s ease-in forwards; animation-delay: 4.6s; }
    .f2{ animation: fall2 2.8s ease-in forwards; animation-delay: 4.8s; }
    .f3{ animation: fall3 3.0s ease-in forwards; animation-delay: 4.9s; }
    .f4{ animation: fall4 2.7s ease-in forwards; animation-delay: 5.0s; }
    .f5{ animation: fall5 3.1s ease-in forwards; animation-delay: 5.1s; }
    .f6{ animation: fall6 2.9s ease-in forwards; animation-delay: 5.2s; }
    .f7{ animation: fall7 3.2s ease-in forwards; animation-delay: 5.25s; }
    .f8{ animation: fall8 2.8s ease-in forwards; animation-delay: 5.35s; }
    .f9{ animation: fall9 3.0s ease-in forwards; animation-delay: 5.45s; }
    .f10{ animation: fall10 3.2s ease-in forwards; animation-delay: 5.55s; }

    /* PLAY kontrol: restart */
    .scene:not(.play) .halo,
    .scene:not(.play) .stem,
    .scene:not(.play) .leaf,
    .scene:not(.play) .head,
    .scene:not(.play) .sparkRing,
    .scene:not(.play) .rose,
    .scene:not(.play) .fall,
    .title:not(.play){
      animation: none !important;
      opacity: 0 !important;
    }
    .scene:not(.play) .stem{ height:0; opacity:1 !important; }
    .scene:not(.play) .halo{ opacity:0 !important; }
    .scene:not(.play) .rose{ opacity:1 !important; }

    /* Animasyonlar */
    @keyframes grow{ from{height:0} to{height: 190px} }

    @keyframes leafIn{
      from{ opacity:0; transform: translateX(-50%) rotate(var(--a)) scale(.2);}
      to{ opacity:1; transform: translateX(-50%) rotate(var(--a)) scale(1);}
    }
    .leaf.left{ --a:-26deg; }
    .leaf.right{ --a:206deg; }

    @keyframes bloom{
      0%{ opacity:0; transform: translateX(-50%) scale(.12); }
      100%{ opacity:1; transform: translateX(-50%) scale(1); }
    }

    @keyframes sparkle{
      0%,100%{ opacity:.22; transform: scale(1); }
      50%{ opacity:.65; transform: scale(1.10); }
    }

    @keyframes haloPulse{
      0%,100%{ opacity:.18; transform: translate(-50%,-50%) scale(1); }
      50%{ opacity:.45; transform: translate(-50%,-50%) scale(1.06); }
    }

    @keyframes wilt{
      0%{ opacity:1; filter:none; transform: translateX(-50%) scale(1) rotate(0deg); }
      100%{ opacity:.16; filter: grayscale(1); transform: translateX(-50%) scale(.92) rotate(-10deg); }
    }

    @keyframes titleIn{
      from{ opacity:0; transform: translateX(-50%) translateY(8px); }
      to{ opacity:1; transform: translateX(-50%) translateY(0); }
    }

    /* düşüş keyframes (farklı yönler) */
    @keyframes fall1{ 0%{opacity:0; transform: translate(-50%,-50%) rotate(0)} 10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% - 120px), calc(-50% + 330px)) rotate(240deg)} }
    @keyframes fall2{ 0%{opacity:0; transform: translate(-50%,-50%) rotate(0)} 10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% + 140px), calc(-50% + 350px)) rotate(320deg)} }
    @keyframes fall3{ 0%{opacity:0; transform: translate(-50%,-50%) rotate(0)} 10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% - 170px), calc(-50% + 360px)) rotate(200deg)} }
    @keyframes fall4{ 0%{opacity:0; transform: translate(-50%,-50%) rotate(0)} 10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% + 70px), calc(-50% + 320px)) rotate(260deg)} }
    @keyframes fall5{ 0%{opacity:0; transform: translate(-50%,-50%) rotate(0)} 10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% + 190px), calc(-50% + 380px)) rotate(330deg)} }
    @keyframes fall6{ 0%{opacity:0; transform: translate(-50%,-50%) rotate(0)} 10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% - 60px), calc(-50% + 370px)) rotate(230deg)} }
    @keyframes fall7{ 0%{opacity:0; transform: translate(-50%,-50%) rotate(0)} 10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% + 20px), calc(-50% + 410px)) rotate(285deg)} }
    @keyframes fall8{ 0%{opacity:0; transform: translate(-50%,-50%) rotate(0)} 10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% - 210px), calc(-50% + 340px)) rotate(250deg)} }
    @keyframes fall9{ 0%{opacity:0; transform: translate(-50%,-50%) rotate(0)} 10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% + 230px), calc(-50% + 360px)) rotate(310deg)} }
    @keyframes fall10{ 0%{opacity:0; transform: translate(-50%,-50%) rotate(0)} 10%{opacity:1}
      100%{opacity:0; transform: translate(calc(-50% - 10px), calc(-50% + 430px)) rotate(270deg)} }
  </style>
</head>

<body>
  <div class="stage" id="stage">
    <div class="title" id="title">Mutlu Yıllar</div>

    <div class="dome">
      <div class="glass"></div>
      <div class="base"></div>

      <div class="scene" id="scene">
        <div class="halo"></div>

        <div class="rose">
          <div class="stem"></div>
          <div class="leaf left"></div>
          <div class="leaf right"></div>

          <div class="head">
            <div class="petal pA"></div><div class="petal pB"></div><div class="petal pC"></div><div class="petal pD"></div>
            <div class="petal pE"></div><div class="petal pF"></div><div class="petal pG"></div><div class="petal pH"></div>
            <div class="petal pI"></div><div class="petal pJ"></div><div class="petal pK"></div>
            <div class="core"></div>
            <div class="sparkRing"></div>

            <!-- dökülen yapraklar -->
            <div class="fall f1"></div><div class="fall f2"></div><div class="fall f3"></div><div class="fall f4"></div><div class="fall f5"></div>
            <div class="fall f6"></div><div class="fall f7"></div><div class="fall f8"></div><div class="fall f9"></div><div class="fall f10"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const scene = document.getElementById('scene');
    const title = document.getElementById('title');

    function restart(){
      scene.classList.remove('play');
      title.classList.remove('play');
      void scene.offsetWidth; // reset anim
      scene.classList.add('play');
      title.classList.add('play');
    }

    restart();
    stage.addEventListener('click', restart);
  </script>
</body>
</html>
