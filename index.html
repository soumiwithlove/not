<!DOCTYPE html>
<html lang="tr">
<head>
   <script async src="https://www.googletagmanager.com/gtag/js?id=G-P55R71D5FM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config','G-P55R71D5FM');
  </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sihirli Çiçek</title>
    <style>
        body {
            background-color: #0b0d11;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .container {
            position: relative;
            text-align: center;
        }

        /* Cam Fanus */
        .glass {
            width: 200px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-bottom: none;
            border-radius: 100px 100px 0 0;
            position: relative;
            z-index: 2;
        }

        .glass::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: -10px;
            width: 220px;
            height: 10px;
            background: #333;
            border-radius: 5px;
        }

        /* Çiçek Gövdesi */
        .stem {
            position: absolute;
            bottom: 10px;
            left: 50%;
            width: 4px;
            height: 0;
            background: #2d5a27;
            transform: translateX(-50%);
            animation: grow-stem 4s forwards;
        }

        /* Çiçek Başlığı (Gül) */
        .flower-head {
            position: absolute;
            bottom: 160px;
            left: 50%;
            width: 50px;
            height: 50px;
            background: #e63946;
            border-radius: 50% 50% 10% 10%;
            transform: translateX(-50%) scale(0);
            opacity: 0;
            animation: bloom 3s 3.5s forwards, wither 4s 8s forwards;
            box-shadow: 0 0 20px rgba(230, 57, 70, 0.5);
        }

        /* Yapraklar */
        .leaf {
            position: absolute;
            width: 20px;
            height: 10px;
            background: #2d5a27;
            border-radius: 15px 0;
            opacity: 0;
            animation: fade-in 2s 2s forwards;
        }

        .leaf.left { left: -15px; top: 100px; transform: rotate(-30deg); }
        .leaf.right { right: -15px; top: 70px; transform: rotate(210deg); }

        /* Mesaj */
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 2.5rem;
            opacity: 0;
            white-space: nowrap;
            text-shadow: 0 0 15px rgba(255,255,255,0.7);
        }

        /* Animasyonlar */
        @keyframes grow-stem {
            to { height: 150px; }
        }

        @keyframes bloom {
            to { transform: translateX(-50%) scale(1); opacity: 1; }
        }

        @keyframes fade-in {
            to { opacity: 1; }
        }

        @keyframes wither {
            0% { transform: translateX(-50%) scale(1) rotate(0); filter: brightness(1); }
            100% { transform: translateX(-50%) scale(0.8) translateY(40px) rotate(15deg); filter: brightness(0.3) grayscale(1); opacity: 0.5; }
        }

        .show-msg {
            animation: final-text 3s forwards;
        }

        @keyframes final-text {
            to { opacity: 1; transform: translate(-50%, -150%); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="glass">
            <div class="stem">
                <div class="leaf left"></div>
                <div class="leaf right"></div>
                <div class="flower-head"></div>
            </div>
        </div>
        <h1 id="message">Mutlu Yıllar</h1>
    </div>

    <script>
        // Çiçek solduktan sonra mesajın gelmesi için zamanlayıcı
        setTimeout(() => {
            document.getElementById('message').classList.add('show-msg');
        }, 11000); // 11. saniyede yazı görünür
    </script>
</body>
</html>
