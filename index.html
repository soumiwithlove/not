<!DOCTYPE html>
<html lang="tr">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-P55R71D5FM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-P55R71D5FM');
    </script>

    <meta charset="UTF-8">
    <title>Büyülü Gül Animasyonu</title>
    <style>
        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .container { position: relative; }

        /* Cam Fanus */
        .glass {
            width: 240px;
            height: 380px;
            background: linear-gradient(to top, rgba(255,255,255,0.05), rgba(255,255,255,0.12));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 120px 120px 10px 10px;
            position: relative;
            box-shadow: 0 0 40px rgba(255, 100, 100, 0.1);
            z-index: 2;
        }

        .base {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 25px;
            background: #111;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        /* Çiçek Sapı */
        .stem {
            position: absolute;
            bottom: 25px;
            left: 50%;
            width: 4px;
            height: 0;
            background: linear-gradient(to top, #132a13, #2d5a27);
            transform: translateX(-50%);
            animation: grow-stem 5s forwards linear;
        }

        /* Gövdedeki Yeşil Yapraklar (Çoğaltıldı) */
        .leaf {
            position: absolute;
            width: 30px;
            height: 15px;
            background: #2d5a27;
            border-radius: 20px 0;
            opacity: 0;
            animation: show 2s 3s forwards;
        }
        .l1 { left: -25px; top: 160px; transform: rotate(-40deg); }
        .l2 { right: -25px; top: 130px; transform: rotate(220deg); }
        .l3 { left: -25px; top: 90px; transform: rotate(-30deg); }
        .l4 { right: -25px; top: 60px; transform: rotate(210deg); }

        /* Gül Başlığı - Yukarı Bakan Düz Form */
        .rose-head {
            position: absolute;
            top: -55px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 60px;
            height: 55px;
            animation: bloom 4s 4s forwards, wither 5s 11s forwards;
        }

        .petal {
            position: absolute;
            background: #d00000;
            border-radius: 50% 50% 20% 20%; /* Düz durması için yuvarlatıldı */
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
            border: 1px solid #900000;
        }
        /* Katmanlı Gül Yaprakları */
        .p1 { transform: scale(1); z-index: 5; background: #e60000; }
        .p2 { transform: scale(1.1) rotate(25deg); z-index: 4; }
        .p3 { transform: scale(1.1) rotate(-25deg); z-index: 4; }
        .p4 { transform: scale(1.2) rotate(50deg); opacity: 0.9; z-index: 3; }
        .p5 { transform: scale(1.2) rotate(-50deg); opacity: 0.9; z-index: 3; }

        /* Düşen Yaprak */
        .falling-petal {
            position: absolute;
            width: 18px;
            height: 12px;
            background: #a00000;
            border-radius: 50% 0 50% 0;
            opacity: 0;
            top: 150px;
            left: 50%;
        }
        .fall-trigger { animation: petal-fall 4s 12s forwards; }

        /* Mesaj Yazısı */
        #message {
            position: absolute;
            width: 100%;
            text-align: center;
            top: -100px;
            color: #fff;
            font-size: 2.2rem;
            font-weight: 200;
            letter-spacing: 5px;
            opacity: 0;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        /* Animasyonlar */
        @keyframes grow-stem { to { height: 200px; } }
        @keyframes show { to { opacity: 1; } }
        @keyframes bloom { to { transform: translateX(-50%) scale(1); } }
        
        @keyframes wither {
            100% { 
                transform: translateX(-50%) scale(0.9) translateY(40px) rotate(15deg); 
                filter: brightness(0.2) grayscale(0.8); 
            }
        }

        @keyframes petal-fall {
            0% { opacity: 0; transform: translateY(0) rotate(0); }
            20% { opacity: 1; }
            100% { opacity: 0.7; transform: translateY(185px) translateX(40px) rotate(120deg); }
        }

        .fade-in-text { animation: final-text 4s forwards; }
        @keyframes final-text { to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="message">MUTLU YILLAR</h1>
        <div class="glass">
            <div class="stem">
                <div class="leaf l1"></div>
                <div class="leaf l2"></div>
                <div class="leaf l3"></div>
                <div class="leaf l4"></div>
                
                <div class="rose-head">
                    <div class="petal p1"></div>
                    <div class="petal p2"></div>
                    <div class="petal p3"></div>
                    <div class="petal p4"></div>
                    <div class="petal p5"></div>
                </div>
            </div>
            <div class="falling-petal" id="petal1"></div>
        </div>
        <div class="base"></div>
    </div>

    <script>
        // Animasyon Zamanlaması
        setTimeout(() => {
            document.getElementById('petal1').classList.add('fall-trigger');
        }, 12000);

        setTimeout(() => {
            document.getElementById('message').classList.add('fade-in-text');
        }, 15000);
    </script>
</body>
</html>
