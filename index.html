<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Beyaz Gül Animasyonu</title>
    <style>
        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .container { position: relative; }

        /* Taban */
        .base {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 25px;
            background: #111;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 1;
        }

        /* Çiçek Sapı */
        .stem {
            position: absolute;
            bottom: 10px;
            left: 50%;
            width: 4px;
            height: 0;
            background: linear-gradient(to top, #132a13, #2d5a27);
            transform: translateX(-50%);
            animation: grow-stem 5s forwards linear;
        }

        /* Yapraklar */
        .leaf {
            position: absolute;
            width: 30px;
            height: 15px;
            background: #2d5a27;
            border-radius: 0 20px;
            opacity: 0;
            animation: show 2s 3s forwards;
        }
        .l1 { left: -25px; top: 160px; transform: rotate(10deg); }
        .l2 { right: -25px; top: 130px; transform: rotate(-10deg); }
        .l3 { left: -25px; top: 90px; transform: rotate(20deg); }
        .l4 { right: -25px; top: 60px; transform: rotate(-20deg); }

        /* Beyaz Gül Başlığı */
        .rose-head {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 60px;
            height: 55px;
            animation: bloom 4s 4s forwards, wither 5s 11s forwards;
        }

        .petal {
            position: absolute;
            background: #ffffff; /* Beyaz Renk */
            border-radius: 20% 20% 50% 50% / 80% 80% 20% 20%;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
            border: 1px solid #f0f0f0;
            transform-origin: bottom center;
        }
        
        .p1 { transform: scale(1); z-index: 5; background: #ffffff; }
        .p2 { transform: scale(1.1) rotate(20deg); z-index: 4; background: #fdfdfd; }
        .p3 { transform: scale(1.1) rotate(-20deg); z-index: 4; background: #fdfdfd; }
        .p4 { transform: scale(1.2) rotate(40deg); opacity: 0.9; z-index: 3; background: #fcfcfc; }
        .p5 { transform: scale(1.2) rotate(-40deg); opacity: 0.9; z-index: 3; background: #fcfcfc; }

        /* Düşen Beyaz Yaprak */
        .falling-petal {
            position: absolute;
            width: 18px;
            height: 12px;
            background: #ffffff;
            border-radius: 50% 0 50% 0;
            opacity: 0;
            top: 150px;
            left: 50%;
            box-shadow: 0 0 5px rgba(255,255,255,0.2);
        }
        .fall-trigger { animation: petal-fall 4s 12s forwards; }

        /* Mesaj Yazısı */
        #message {
            position: absolute;
            width: 100%;
            text-align: center;
            top: -180px;
            color: #fff;
            font-size: 2.2rem;
            font-weight: 200;
            letter-spacing: 5px;
            opacity: 0;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            white-space: nowrap;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Animasyonlar */
        @keyframes grow-stem { to { height: 200px; } }
        @keyframes show { to { opacity: 1; } }
        @keyframes bloom { to { transform: translateX(-50%) scale(1); } }
        
        @keyframes wither {
            100% { 
                transform: translateX(-50%) scale(0.9) translateY(40px) rotate(15deg); 
                filter: brightness(0.5) grayscale(0.5); 
                opacity: 0.6;
            }
        }

        @keyframes petal-fall {
            0% { opacity: 0; transform: translateY(-100px) rotate(0); }
            20% { opacity: 1; }
            100% { opacity: 0.8; transform: translateY(185px) translateX(30px) rotate(150deg); }
        }

        .fade-in-text { animation: final-text 4s forwards; }
        @keyframes final-text { to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="message">MUTLU YILLAR</h1>
        <div class="stem">
            <div class="leaf l1"></div>
            <div class="leaf l2"></div>
            <div class="leaf l3"></div>
            <div class="leaf l4"></div>
            
            <div class="rose-head">
                <div class="petal p1"></div>
                <div class="petal p2"></div>
                <div class="petal p3"></div>
                <div class="petal p4"></div>
                <div class="petal p5"></div>
            </div>
        </div>
        <div class="falling-petal" id="petal1"></div>
        <div class="base"></div>
    </div>

    <script>
        setTimeout(() => {
            document.getElementById('petal1').classList.add('fall-trigger');
        }, 12000);

        setTimeout(() => {
            document.getElementById('message').classList.add('fade-in-text');
        }, 15000);
    </script>
</body>
</html>
